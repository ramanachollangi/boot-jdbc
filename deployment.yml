apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-service
  labels:
    app: store-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: store-service
  template:
    metadata:
      labels:
        app: store-service
    spec:
      containers:
        # 1. Your Spring Boot App Container
        - name: store-service
          image: us-central1-docker.pkg.dev/project-c511d3e5-da4d-466b-831/my-gke-repo/store-service:latest
          ports:
            - containerPort: 8090
          env:
            # Activate the Kubernetes profile
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-service:3306/developer_database?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: SPRING_DATASOURCE_DRIVER
              value: "com.mysql.cj.jdbc.Driver"
---
apiVersion: v1
kind: Service
metadata:
  name: store-service-service
spec:
  selector:
    app: store-service
  ports:
    - name: http
      port: 8090
      targetPort: 8090
  type: LoadBalancer