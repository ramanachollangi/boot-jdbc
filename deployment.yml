apiVersion: apps/v1
kind: Deployment
metadata:
  name: boot-store-jdbc-deployment
  labels:
    app: boot-store-jdbc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: boot-store-jdbc
  template:
    metadata:
      labels:
        app: boot-store-jdbc
    spec:
      containers:
        # 1. Your Spring Boot App Container
        - name: boot-jdbc
          image: us-central1-docker.pkg.dev/project-c511d3e5-da4d-466b-831/my-gke-repo/boot-jdbc:v1
          ports:
            - containerPort: 8090
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-service:3306/developer_database?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: SPRING_DATASOURCE_DRIVER
              value: "com.mysql.cj.jdbc.Driver"

        # 2. Cloud SQL Auth Proxy Sidecar Container
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8.0
          args:
            - "project-c511d3e5-da4d-466b-831:us-central1:my-mysql-instance"
          securityContext:
            runAsNonRoot: true
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: boot-store-jdbc-service
spec:
  selector:
    app: boot-store-jdbc
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8090
  type: ClusterIP