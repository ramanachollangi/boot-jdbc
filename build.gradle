plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sprdlearn.boot'
version = '0.0.1-SNAPSHOT'
description = 'boot-jdbc'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation name: 'boot-mysql-connection-starter-0.0.1-plain' // or boot-jdbc depending on your group ID
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // 3. Lombok MUST be explicitly declared here for the compiler to process annotations
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}


tasks.named('test') {
    useJUnitPlatform()
}
