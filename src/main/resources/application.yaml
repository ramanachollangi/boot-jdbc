server:
  port: 8090
spring:
  application:
    name: boot-store-jdbc
  jpa:
    hibernate:
      ddl-auto=update: update
custom:
  mysql:
    url: ${SPRING_DATASOURCE_URL}
    userName:  ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driverClassName: ${SPRING_DATASOURCE_DRIVER}
